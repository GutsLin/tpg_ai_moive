name: ${NARRIX_COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NARRIX_DB_NAME}
      POSTGRES_USER: ${NARRIX_DB_USER}
      POSTGRES_PASSWORD: ${NARRIX_DB_PASSWORD}
    volumes:
      - narrix-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NARRIX_DB_USER} -d ${NARRIX_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - narrix

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - narrix-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - narrix

  migrate:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    restart: "no"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - narrix

  backend:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - ${NARRIX_BACKEND_PORT}:3000
    environment:
      NODE_ENV: production
      NARRIX_PROFILE: ${NARRIX_PROFILE}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - narrix

  frontend:
    image: narrix-frontend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ''
    restart: unless-stopped
    ports:
      - ${NARRIX_FRONTEND_PORT}:80
    depends_on:
      backend:
        condition: service_started
    networks:
      - narrix

  worker-video:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    command: ["node", "dist/workers/video.worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NARRIX_PROFILE: ${NARRIX_PROFILE}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
    labels:
      service: worker-video
      environment: ${NARRIX_PROFILE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - narrix

  worker-asset-sync:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    command: ["node", "dist/workers/asset-sync.worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NARRIX_PROFILE: ${NARRIX_PROFILE}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
    labels:
      service: worker-asset-sync
      environment: ${NARRIX_PROFILE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - narrix

volumes:
  narrix-db:
    name: ${NARRIX_DB_VOLUME}
  narrix-redis:
    name: ${NARRIX_REDIS_VOLUME}

networks:
  narrix:
    name: ${NARRIX_NETWORK_NAME}
