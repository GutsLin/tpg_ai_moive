name: ${NARRIX_COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NARRIX_DB_NAME}
      POSTGRES_USER: ${NARRIX_DB_USER}
      POSTGRES_PASSWORD: ${NARRIX_DB_PASSWORD}
    volumes:
      - narrix-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NARRIX_DB_USER} -d ${NARRIX_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - narrix

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - narrix-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - narrix

  migrate:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    restart: "no"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - narrix

  backend:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - ${NARRIX_BACKEND_PORT}:3000
    environment:
      NODE_ENV: production
      NARRIX_PROFILE: ${NARRIX_PROFILE}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
      ATELIER_SSO_SERVICE_SECRET: ${ATELIER_SSO_SERVICE_SECRET}
      ATELIER_SSO_ISSUER: ${ATELIER_SSO_ISSUER:-narrix-main}
      ATELIER_SSO_AUDIENCE: ${ATELIER_SSO_AUDIENCE:-narrix-atelier}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - narrix

  atelier-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATELIER_DB_NAME:-atelier}
      POSTGRES_USER: ${ATELIER_DB_USER:-atelier}
      POSTGRES_PASSWORD: ${ATELIER_DB_PASSWORD:-atelier-dev-password}
    volumes: [atelier-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    networks: [narrix]

  atelier-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [atelier-redis:/data]
    networks: [narrix]

  atelier-backend:
    image: narrix-atelier-backend:${NARRIX_IMAGE_TAG:-local}
    build:
      context: ../../Narrix-Infinite-Atelier
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${ATELIER_DB_USER:-atelier}:${ATELIER_DB_PASSWORD:-atelier-dev-password}@atelier-postgres:5432/${ATELIER_DB_NAME:-atelier}?schema=public
      REDIS_URL: redis://atelier-redis:6379
      PORT: 4000
      JWT_SECRET: ${ATELIER_JWT_SECRET:-change-me-atelier-jwt-secret}
      AES_MASTER_KEY: ${ATELIER_AES_MASTER_KEY}
      METRICS_TOKEN: ${ATELIER_METRICS_TOKEN}
      MAIN_PROJECT_SSO_EXCHANGE_URL: http://backend:3000/api/auth/internal/atelier/sso/exchange
      ATELIER_SSO_SERVICE_SECRET: ${ATELIER_SSO_SERVICE_SECRET}
      COOKIE_SECURE: ${ATELIER_COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${ATELIER_FRONTEND_ORIGIN:-http://localhost}
    depends_on:
      atelier-postgres: { condition: service_healthy }
      atelier-redis: { condition: service_started }
      backend: { condition: service_started }
    networks: [narrix]

  atelier-web:
    build:
      context: ../../Narrix-Infinite-Atelier
      dockerfile: web/Dockerfile
      args:
        VITE_BASE: /atelier/
        VITE_API_BASE_URL: /atelier-api/api/v1
        VITE_MAIN_APP_URL: /
    restart: unless-stopped
    volumes:
      - ../../Narrix-Infinite-Atelier/deploy/nginx.internal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [atelier-backend]
    networks: [narrix]

  frontend:
    image: narrix-frontend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ''
    restart: unless-stopped
    ports:
      - ${NARRIX_FRONTEND_PORT}:80
    depends_on:
      backend:
        condition: service_started
      atelier-web:
        condition: service_started
    networks:
      - narrix

  worker-video:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    command: ["node", "dist/workers/video.worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NARRIX_PROFILE: ${NARRIX_PROFILE}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
    labels:
      service: worker-video
      environment: ${NARRIX_PROFILE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - narrix

  worker-asset-sync:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    command: ["node", "dist/workers/asset-sync.worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NARRIX_PROFILE: ${NARRIX_PROFILE}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
    labels:
      service: worker-asset-sync
      environment: ${NARRIX_PROFILE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - narrix

  worker-atelier-image:
    image: narrix-backend:${NARRIX_IMAGE_TAG:-local}
    pull_policy: never
    command: ["node", "dist/workers/atelier-image.worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${NARRIX_DB_USER}
      DB_PASSWORD: ${NARRIX_DB_PASSWORD}
      DB_NAME: ${NARRIX_DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${NARRIX_REDIS_PASSWORD:-}
      JWT_SECRET: ${NARRIX_JWT_SECRET}
      JWT_EXPIRES_IN: ${NARRIX_JWT_EXPIRES_IN:-7d}
      CONFIG_ENCRYPTION_KEY: ${NARRIX_CONFIG_ENCRYPTION_KEY}
      ATELIER_SSO_SERVICE_SECRET: ${ATELIER_SSO_SERVICE_SECRET}
      ATELIER_SSO_ISSUER: ${ATELIER_SSO_ISSUER:-narrix-main}
      ATELIER_SSO_AUDIENCE: ${ATELIER_SSO_AUDIENCE:-narrix-atelier}
    labels:
      service: worker-atelier-image
      environment: ${NARRIX_PROFILE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - narrix

volumes:
  narrix-db:
    name: ${NARRIX_DB_VOLUME}
  narrix-redis:
    name: ${NARRIX_REDIS_VOLUME}
  atelier-db:
    name: ${ATELIER_DB_VOLUME:-atelier_db}
  atelier-redis:
    name: ${ATELIER_REDIS_VOLUME:-atelier_redis}

networks:
  narrix:
    name: ${NARRIX_NETWORK_NAME}
